<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#d84315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="晚餐管家">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<title>晚餐管家</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family: "PingFang SC","Microsoft YaHei","Helvetica Neue",sans-serif; background:#fdf6f0; color:#3e2723; min-height:100vh; padding-bottom:40px; }
.header { background:linear-gradient(135deg,#d84315,#bf360c); color:#fff; padding:16px 20px; text-align:center; box-shadow:0 2px 12px rgba(0,0,0,.15); position:sticky; top:0; z-index:100; }
.header h1 { font-size:22px; font-weight:600; }
.header .sub { font-size:13px; opacity:.85; margin-top:2px; }
.header .addr { font-size:11px; opacity:.7; margin-top:2px; }

.container { max-width:800px; margin:0 auto; padding:16px; }

/* Week Navigation */
.week-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
.week-header button { width:32px; height:32px; border-radius:50%; border:2px solid #e0d5cc; background:#fff; cursor:pointer; font-size:16px; color:#d84315; transition:all .2s; display:flex; align-items:center; justify-content:center; }
.week-header button:hover { background:#d84315; color:#fff; border-color:#d84315; }
.week-header button:disabled { opacity:.3; cursor:default; pointer-events:none; }
.week-header .week-label { font-size:13px; font-weight:600; color:#8d6e63; }

/* Week Tabs */
.week-nav { display:flex; gap:4px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; }
.week-nav .day { flex:0 0 auto; min-width:72px; padding:10px 8px; border-radius:12px; text-align:center; cursor:pointer; background:#fff; border:2px solid #e0d5cc; transition:all .2s; }
.week-nav .day:hover { border-color:#d84315; }
.week-nav .day.active { background:#d84315; color:#fff; border-color:#d84315; }
.week-nav .day.active .dow, .week-nav .day.active .label { color:rgba(255,255,255,.8); }
.week-nav .day.today { box-shadow:0 0 0 3px rgba(216,67,21,.3); }
.week-nav .day.eatout { background:#f5f5f5; color:#999; border-style:dashed; }
.week-nav .day .dow { font-size:11px; opacity:.7; }
.week-nav .day .date { font-size:14px; font-weight:600; }
.week-nav .day .label { font-size:10px; }

/* Day Detail */
.day-detail { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.day-detail .day-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:8px; }
.day-detail h2 { font-size:18px; color:#bf360c; display:flex; align-items:center; gap:8px; }
.day-detail h2 .badge { font-size:12px; background:#ffcc02; color:#3e2723; padding:2px 8px; border-radius:10px; }
.btn-refresh { padding:6px 14px; border-radius:14px; border:1px solid #d84315; background:#fff; color:#d84315; cursor:pointer; font-size:12px; transition:all .2s; white-space:nowrap; }
.btn-refresh:hover { background:#d84315; color:#fff; }
.eatout-card { text-align:center; padding:40px 20px; color:#999; }
.eatout-card .icon { font-size:48px; margin-bottom:12px; }

/* Dish Card */
.dish-card { display:flex; gap:12px; padding:14px; margin-bottom:10px; background:#fdfaf7; border-radius:12px; border:1px solid #f0e8e0; align-items:flex-start; }
.dish-card .cat-tag { display:inline-block; font-size:10px; padding:2px 8px; border-radius:8px; color:#fff; font-weight:600; margin-bottom:6px; }
.cat-tag.meat { background:#d84315; }
.cat-tag.half { background:#ef6c00; }
.cat-tag.veg { background:#2e7d32; }
.cat-tag.soup { background:#0277bd; }
.dish-card h3 { font-size:15px; margin-bottom:4px; }
.dish-card .steps { font-size:12px; color:#666; line-height:1.6; }
.dish-card .video-link { display:inline-block; margin-top:6px; font-size:12px; color:#d84315; text-decoration:none; }
.dish-card .video-link:hover { text-decoration:underline; }
.dish-card .actions { display:flex; gap:6px; margin-top:8px; }
.dish-card .actions button { padding:4px 14px; border-radius:14px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:12px; transition:all .2s; display:flex; align-items:center; gap:4px; }
.dish-card .actions button:hover { transform:scale(1.05); }
.dish-card .actions .btn-like { border-color:#4caf50; color:#4caf50; }
.dish-card .actions .btn-like.liked { background:#4caf50; color:#fff; }
.dish-card .actions .btn-dislike { border-color:#f44336; color:#f44336; }
.dish-card .actions .btn-dislike.disliked { background:#f44336; color:#fff; }
.dish-card .actions .btn-swap { border-color:#ff9800; color:#ff9800; }
.dish-card .actions .btn-swap:hover { background:#ff9800; color:#fff; }

/* Add Dish Modal */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.5); z-index:200; justify-content:center; align-items:center; padding:20px; }
.modal-overlay.show { display:flex; }
.modal { background:#fff; border-radius:16px; padding:24px; width:100%; max-width:440px; max-height:85vh; overflow-y:auto; }
.modal h3 { font-size:18px; color:#bf360c; margin-bottom:16px; }
.form-group { margin-bottom:14px; }
.form-group label { display:block; font-size:13px; font-weight:600; color:#5d4037; margin-bottom:4px; }
.form-group input, .form-group textarea, .form-group select { width:100%; padding:8px 12px; border:1px solid #e0d5cc; border-radius:8px; font-size:13px; font-family:inherit; resize:vertical; }
.form-group textarea { min-height:60px; }
.form-group .hint { font-size:11px; color:#999; margin-top:2px; }
.modal .btn-row { display:flex; gap:8px; margin-top:18px; }
.modal .btn-row button { flex:1; padding:10px; border-radius:10px; border:none; cursor:pointer; font-size:14px; font-weight:600; }
.modal .btn-save { background:#d84315; color:#fff; }
.modal .btn-cancel { background:#f5f0eb; color:#8d6e63; }
.ingredient-row { display:flex; gap:6px; margin-bottom:6px; align-items:center; }
.ingredient-row input { flex:1; }
.ingredient-row select { width:100px; }
.ingredient-row .btn-remove-ing { padding:4px 8px; border-radius:6px; border:1px solid #f44336; background:#fff; color:#f44336; cursor:pointer; font-size:11px; }
.btn-add-ing { padding:4px 12px; border-radius:10px; border:1px dashed #d84315; background:#fff; color:#d84315; cursor:pointer; font-size:12px; margin-top:4px; }

/* Header add dish button */
.header-actions { display:flex; gap:8px; justify-content:center; margin-top:6px; }
.btn-add-dish { padding:4px 16px; border-radius:14px; border:1px solid rgba(255,255,255,.6); background:rgba(255,255,255,.15); color:#fff; cursor:pointer; font-size:12px; transition:all .2s; }
.btn-add-dish:hover { background:rgba(255,255,255,.3); }

/* Shopping List */
.shopping-list { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.shopping-list h2 { font-size:18px; margin-bottom:16px; color:#bf360c; }
.shopping-list .app-section { margin-bottom:16px; }
.shopping-list .app-title { font-size:14px; font-weight:600; color:#fff; padding:6px 14px; border-radius:8px; display:inline-block; margin-bottom:10px; }
.app-title.dingdong { background:#43a047; }
.app-title.meituan { background:#ffb300; color:#3e2723; }
.shopping-list ul { list-style:none; }
.shopping-list li { padding:8px 0; border-bottom:1px solid #f5f0eb; font-size:13px; display:flex; align-items:center; gap:8px; }
.shopping-list li:last-child { border-bottom:none; }
.shopping-list li .qty { color:#999; font-size:11px; white-space:nowrap; }
.cat-group { margin-bottom:12px; }
.cat-label { font-size:12px; font-weight:600; color:#8d6e63; padding:4px 0 4px 4px; border-bottom:1px dashed #f0e8e0; margin-bottom:4px; }
.shopping-list .note { font-size:11px; color:#999; margin-top:8px; font-style:italic; }
.no-data { text-align:center; padding:30px; color:#999; }

/* Preferences */
.prefs-section { background:#fff; border-radius:16px; padding:20px; margin-bottom:16px; box-shadow:0 2px 8px rgba(0,0,0,.06); }
.prefs-section h2 { font-size:16px; margin-bottom:12px; }
.pref-tags { display:flex; flex-wrap:wrap; gap:6px; }
.pref-tag { font-size:12px; padding:4px 12px; border-radius:12px; }
.pref-tag.liked { background:#e8f5e9; color:#2e7d32; }
.pref-tag.disliked { background:#ffebee; color:#c62828; text-decoration:line-through; }

.footer { text-align:center; padding:20px; font-size:11px; color:#bbb; }
</style>
</head>
<body>
<div class="header">
  <h1>晚餐管家</h1>
  <div class="sub">3大2小 · 1荤1半1素1汤 · 周三/六外出就餐</div>
</div>

<div class="container">
  <div class="week-header">
    <button id="btnPrevWeek" title="上一周">◀</button>
    <span class="week-label" id="weekLabel"></span>
    <button id="btnNextWeek" title="下一周">▶</button>
  </div>
  <div class="week-nav" id="weekNav"></div>
  <div class="day-detail" id="dayDetail"></div>
  <div class="shopping-list" id="shoppingList"></div>
  <div class="prefs-section" id="prefsSection"></div>
</div>
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <h3 id="modalTitle">＋ 添加新菜</h3>
    <div class="form-group">
      <label>菜品名称</label>
      <input type="text" id="dishName" placeholder="如：糖醋里脊">
    </div>
    <div class="form-group">
      <label>分类</label>
      <select id="dishCat">
        <option value="meat" selected>荤菜</option>
        <option value="halfMeat">半荤半素</option>
        <option value="vegetable">素菜</option>
        <option value="soup">汤</option>
      </select>
    </div>
    <div class="form-group">
      <label>烹饪步骤</label>
      <textarea id="dishSteps" placeholder="1.第一步；2.第二步；3..."></textarea>
    </div>
    <div class="form-group">
      <label>视频教程链接（选填）</label>
      <input type="text" id="dishVideo" placeholder="https://search.bilibili.com/all?keyword=xxx">
    </div>
    <div class="form-group">
      <label>食材清单</label>
      <div id="ingredientRows">
        <div class="ingredient-row">
          <input type="text" placeholder="食材名" class="ing-name">
          <input type="text" placeholder="用量" class="ing-qty" style="width:100px">
          <select class="ing-app"><option value="dingdong">叮咚</option><option value="meituan">美团</option></select>
          <button class="btn-remove-ing" onclick="this.parentElement.remove()">✕</button>
        </div>
      </div>
      <button class="btn-add-ing" id="btnAddIng">＋ 添加食材</button>
      <div class="hint">默认在叮咚买菜购买，可切换为美团</div>
    </div>
    <div class="btn-row">
      <button class="btn-cancel" id="btnCancelDish">取消</button>
      <button class="btn-save" id="btnSaveDish">保存</button>
    </div>
  </div>
</div>

<div class="footer">菜单自动生成 · 点击喜欢/不喜欢来调教你的专属菜谱 · 不喜欢的菜不再出现</div>

<script>

const MODE = 'owner';

    { id:'m5', name:'清蒸鲈鱼', steps:'1.鲈鱼洗净两面划刀；2.鱼身抹盐和料酒，放姜片葱段；3.水开后上锅蒸8-10分钟；4.倒掉盘中汤汁；5.铺上新葱丝姜丝，淋蒸鱼豉油；6.热油浇在葱丝上。', video:'https://search.bilibili.com/all?keyword=清蒸鲈鱼', ingredients:[{name:'鲈鱼',qty:'1条(约500g)',app:'dingdong'},{name:'姜',qty:'5片',app:'dingdong'},{name:'小葱',qty:'3根',app:'dingdong'},{name:'蒸鱼豉油',qty:'2勺',app:'dingdong'},{name:'料酒',qty:'1勺',app:'dingdong'}] },

// ============ STATE ============
const STORAGE_KEY = 'dinner_planner_state';
const RECENT_DAYS = 14;
const LIKED_COOLDOWN = 7;

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      if (!s.customDishes) s.customDishes = { meat:[], halfMeat:[], vegetable:[], soup:[] };
      if (s.version == null) s.version = 0;
      return s;
    }
  } catch(e) {}
  return { liked:{}, disliked:{}, history:{}, menu:{}, customDishes:{ meat:[], halfMeat:[], vegetable:[], soup:[] }, version: 0 };
}

function bumpVersion() { state.version = (state.version || 0) + 1; }

function allDishes() {
  const merged = {};
  for (const cat of ['meat','halfMeat','vegetable','soup']) {
    merged[cat] = [...DISHES[cat], ...(state.customDishes[cat] || [])];
  }
  return merged;
}

function saveState(s) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
}

let state = loadState();

// ============ HELPERS ============
function dateKey(d) { return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; }

function getMonday(d) {
  const m = new Date(d);
  const day = m.getDay();
  const diff = day === 0 ? -6 : 1 - day;
  m.setDate(m.getDate() + diff);
  m.setHours(0,0,0,0);
  return m;
}

function isEatOutDay(d) {
  const dow = d.getDay();
  return dow === 3 || dow === 6;
}

function formatDate(d) {
  return `${d.getMonth()+1}/${d.getDate()}`;
}

function getDOW(d) {
  return ['周日','周一','周二','周三','周四','周五','周六'][d.getDay()];
}

// ============ MENU GENERATION ============
function getAllAvailable(cat) {
  return allDishes()[cat].filter(d => !state.disliked[d.id]);
}

function getRecentlyUsed() {
  const now = Date.now();
  const cutoff = now - RECENT_DAYS * 24 * 3600 * 1000;
  const recent = new Set();
  Object.entries(state.history).forEach(([id, ts]) => {
    if (ts > cutoff) recent.add(id);
  });
  return recent;
}

function getLikedOnCooldown() {
  // Liked dishes that were used too recently to reuse
  const now = Date.now();
  const cutoff = now - LIKED_COOLDOWN * 24 * 3600 * 1000;
  const onCooldown = new Set();
  Object.entries(state.liked).forEach(([id, ts]) => {
    if (ts > cutoff) onCooldown.add(id);
  });
  return onCooldown;
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function pickDayMenu(usedThisWeek) {
  const recent = getRecentlyUsed();

  const filterAvailable = (cat) => shuffle(getAllAvailable(cat).filter(d => !usedThisWeek.has(d.id) && !recent.has(d.id)));

  let availMeat = filterAvailable('meat');
  let availHalf = filterAvailable('halfMeat');
  let availVeg = filterAvailable('vegetable');
  let availSoup = filterAvailable('soup');

  const pickRelaxed = (cat, pool) => {
    if (pool.length > 0) return pool[0];
    const relaxed = shuffle(getAllAvailable(cat).filter(d => !usedThisWeek.has(d.id)));
    if (relaxed.length > 0) return relaxed[0];
    return allDishes()[cat][0];
  };

  const meat = pickRelaxed('meat', availMeat);
  usedThisWeek.add(meat.id);

  let dish2;
  if (availHalf.length > 0 && Math.random() > 0.3) {
    dish2 = availHalf[0];
  } else {
    const otherMeat = availMeat.filter(d => d.id !== meat.id);
    if (otherMeat.length > 0) {
      dish2 = otherMeat[0];
    } else {
      dish2 = pickRelaxed('halfMeat', availHalf);
    }
  }
  usedThisWeek.add(dish2.id);

  const veg = pickRelaxed('vegetable', availVeg);
  usedThisWeek.add(veg.id);

  const soup = pickRelaxed('soup', availSoup);
  usedThisWeek.add(soup.id);

  return { dishes: [meat, dish2, veg], soup };
}

function generateWeekMenu(monday) {
  const usedThisWeek = new Set();
  const menu = {};

  for (let i = 0; i < 7; i++) {
    const day = new Date(monday);
    day.setDate(monday.getDate() + i);
    const key = dateKey(day);

    if (isEatOutDay(day)) {
      menu[key] = { eatOut: true };
    } else {
      menu[key] = pickDayMenu(usedThisWeek);
    }
  }

  return menu;
}

function getMenuForDate(d) {
  const monday = getMonday(d);
  const weekKey = dateKey(monday);

  if (!state.menu[weekKey]) {
    state.menu[weekKey] = generateWeekMenu(monday);
    const keys = Object.keys(state.menu).sort();
    while (keys.length > 4) delete state.menu[keys.shift()];
    saveState(state);
  }

  return state.menu[weekKey][dateKey(d)] || { eatOut: true };
}

// ============ RENDER ============
const today = new Date();
let currentMonday = getMonday(today);
let selectedDate = new Date(today);

function renderWeekNav() {
  const nav = document.getElementById('weekNav');
  const label = document.getElementById('weekLabel');
  const sun = new Date(currentMonday);
  sun.setDate(currentMonday.getDate() + 6);

  label.textContent = `${currentMonday.getFullYear()}年${currentMonday.getMonth()+1}月${currentMonday.getDate()}日 - ${sun.getMonth()+1}月${sun.getDate()}日`;

  let html = '';
  for (let i = 0; i < 7; i++) {
    const d = new Date(currentMonday);
    d.setDate(currentMonday.getDate() + i);
    const key = dateKey(d);
    const isToday = key === dateKey(today);
    const isSel = key === dateKey(selectedDate);
    const eatOut = isEatOutDay(d);
    let cls = 'day';
    if (isSel) cls += ' active';
    if (isToday) cls += ' today';
    if (eatOut) cls += ' eatout';
    html += `<div class="${cls}" data-date="${key}">
      <div class="dow">${getDOW(d)}</div>
      <div class="date">${formatDate(d)}</div>
      <div class="label">${eatOut ? '外出就餐' : '家庭晚餐'}</div>
    </div>`;
  }
  nav.innerHTML = html;

  nav.querySelectorAll('.day').forEach(el => {
    el.addEventListener('click', () => {
      selectedDate = new Date(el.dataset.date + 'T00:00:00');
      renderDayDetail();
      renderShoppingList();
      renderWeekNav();
    });
  });
}

function regenerateDay(d) {
  const monday = getMonday(d);
  const weekKey = dateKey(monday);
  if (!state.menu[weekKey]) return;

  // Rebuild usedThisWeek excluding this day's dishes
  const usedThisWeek = new Set();
  for (let i = 0; i < 7; i++) {
    const day = new Date(monday);
    day.setDate(monday.getDate() + i);
    const key = dateKey(day);
    if (key === dateKey(d)) continue;
    const m = state.menu[weekKey][key];
    if (m && !m.eatOut) {
      m.dishes.forEach(dish => usedThisWeek.add(dish.id));
      usedThisWeek.add(m.soup.id);
    }
  }

  if (isEatOutDay(d)) {
    state.menu[weekKey][dateKey(d)] = { eatOut: true };
  } else {
    state.menu[weekKey][dateKey(d)] = pickDayMenu(usedThisWeek);
  }
  bumpVersion();
  saveState(state);
}

function renderDayDetail() {
  const container = document.getElementById('dayDetail');
  const key = dateKey(selectedDate);
  const menu = getMenuForDate(selectedDate);
  const isToday = key === dateKey(today);

  if (menu.eatOut) {
    container.innerHTML = `<div class="eatout-card">
      <div class="icon">🍽️</div>
      <p>今天是${getDOW(selectedDate)}，外出就餐日～</p>

  }

  const catLabel = { meat: '荤菜', half: '半荤半素', veg: '素菜', soup: '汤' };
  const catKeyToCSS = { meat:'meat', halfMeat:'half', vegetable:'veg', soup:'soup' };
  const allDishes = [...menu.dishes, menu.soup];

  const owner = MODE === 'owner';
  let html = `<div class="day-header">
    <h2>${isToday ? '🍽️ 今晚菜谱' : '📋 当日菜谱'} ${isToday ? '<span class="badge">今天</span>' : ''}</h2>
    ${owner ? '<button class="btn-refresh" id="btnRegenerate">🔄 换一批菜</button><button class="btn-refresh" id="btnAddDish">＋ 加个菜</button>' : ''}
  </div>`;

  allDishes.forEach((d, idx) => {
    const catKey = idx < menu.dishes.length ? findDishCat(d.id) : 'soup';
    const cat = catKeyToCSS[catKey] || 'meat';
    const isLiked = state.liked[d.id];
    const isDisliked = state.disliked[d.id];

    html += `<div class="dish-card">
      <div style="flex:1">
        <span class="cat-tag ${cat}">${catLabel[cat]}</span>
        <h3>${d.name}</h3>
        <div class="steps">${d.steps}</div>
        ${d.video ? `<a class="video-link" href="${d.video}" target="_blank" rel="noopener">▶ 搜索视频教程</a>` : ''}
        ${owner ? `<div class="actions">
          <button class="btn-like ${isLiked ? 'liked' : ''}" data-id="${d.id}" data-action="like">
            ${isLiked ? '❤️ 已喜欢' : '🤍 喜欢'}
          </button>
          <button class="btn-dislike ${isDisliked ? 'disliked' : ''}" data-id="${d.id}" data-action="dislike">
            ${isDisliked ? '👎 已不喜欢' : '👎 不喜欢'}
          </button>
          <button class="btn-swap" data-id="${d.id}" data-action="swap">
            🔄 换一个
          </button>
        </div>` : ''}
      </div>
    </div>`;
  });

  container.innerHTML = html;

  container.querySelectorAll('button[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.action === 'swap') {
        handleSwap(btn.dataset.id);
      } else {
        handlePreference(btn.dataset.id, btn.dataset.action);
      }
    });
  });

  const regenBtn = document.getElementById('btnRegenerate');
  if (regenBtn) {
    regenBtn.addEventListener('click', () => {
      regenerateDay(selectedDate);
      renderDayDetail();
      renderShoppingList();
    });
  }

  const addBtn = document.getElementById('btnAddDish');
  if (addBtn) {
    addBtn.addEventListener('click', openAddDishModal);
  }
}

function handlePreference(id, action) {
  if (action === 'like') {
    if (state.liked[id]) {
      delete state.liked[id];
    } else {
      state.liked[id] = Date.now();
      delete state.disliked[id];
    }
  } else {
    if (state.disliked[id]) {
      delete state.disliked[id];
    } else {
      state.disliked[id] = Date.now();
      delete state.liked[id];
    }
  }

  state.history[id] = Date.now();
  const weekKey = dateKey(getMonday(today));
  delete state.menu[weekKey];

  // Reset selectedDate to today so the regenerated menu shows
  selectedDate = new Date(today);
  currentMonday = getMonday(today);

  bumpVersion();
  saveState(state);
  renderAll();
}

function handleSwap(dishId) {
  const cat = findDishCat(dishId);
  if (!cat) return;

  const monday = getMonday(selectedDate);
  const weekKey = dateKey(monday);
  if (!state.menu[weekKey]) return;

  const dayMenu = state.menu[weekKey][dateKey(selectedDate)];
  if (!dayMenu || dayMenu.eatOut) return;

  // Build usedThisWeek excluding the dish being swapped
  const usedThisWeek = new Set();
  for (let i = 0; i < 7; i++) {
    const d = new Date(monday);
    d.setDate(monday.getDate() + i);
    const key = dateKey(d);
    if (key === dateKey(selectedDate)) continue;
    const m = state.menu[weekKey][key];
    if (m && !m.eatOut) {
      m.dishes.forEach(dish => usedThisWeek.add(dish.id));
      usedThisWeek.add(m.soup.id);
    }
  }
  // Also add other dishes from today (excluding the one being swapped)
  dayMenu.dishes.forEach(d => { if (d.id !== dishId) usedThisWeek.add(d.id); });
  if (dayMenu.soup && dayMenu.soup.id !== dishId) usedThisWeek.add(dayMenu.soup.id);

  const recent = getRecentlyUsed();
  const available = shuffle(getAllAvailable(cat).filter(d =>
    d.id !== dishId && !usedThisWeek.has(d.id) && !recent.has(d.id)
  ));

  if (available.length === 0) {
    alert('没有可替换的菜品了，请先添加新菜或调整偏好');
    return;
  }

  const newDish = available[0];
  if (cat === 'soup') {
    dayMenu.soup = newDish;
  } else {
    const idx = dayMenu.dishes.findIndex(d => d.id === dishId);
    if (idx >= 0) dayMenu.dishes[idx] = newDish;
  }

  usedThisWeek.add(newDish.id);
  state.history[newDish.id] = Date.now();
  bumpVersion();
  saveState(state);
  renderDayDetail();
  renderShoppingList();
}

// ============ INGREDIENT CLASSIFICATION ============
// Categorize each ingredient as: 食材 (main), 辅料 (auxiliary), 调味品 (seasoning)
const SEASONING_SET = new Set([
  '生抽','老抽','料酒','香醋','陈醋','白醋','白糖','冰糖','蚝油','盐','鸡精','味精',
  '郫县豆瓣酱','香油','白胡椒粉','花椒粉','辣椒面','椒盐','蒸鱼豉油','辣椒油',
  '黄豆酱','甜面酱','番茄酱','芝麻酱','老干妈','十三香','五香粉',
]);
const AUXILIARY_SET = new Set([
  '淀粉','干木耳','干香菇','花生米','紫菜','虾皮','枸杞','黄花菜','白芝麻','黑芝麻',
  '干辣椒','花椒','八角','桂皮','香叶','姜','大蒜','小葱','大葱','蒜苗','香菜',
  '啤酒','可乐','雪碧',
]);
function classifyIngredient(name) {
  if (SEASONING_SET.has(name)) return 'seasoning';
  if (AUXILIARY_SET.has(name)) return 'auxiliary';
  return 'ingredient';
}
const CAT_LABELS = { ingredient:'🥩 食材', auxiliary:'📦 辅料', seasoning:'🧂 调味品' };

function renderShoppingList() {
  const container = document.getElementById('shoppingList');
  const menu = getMenuForDate(selectedDate);

  if (menu.eatOut) {
    container.innerHTML = '<h2>🛒 今日采购</h2><div class="no-data">今日外出就餐，无需采购</div>';
    return;
  }

  const allDishes = [...menu.dishes, menu.soup];
  // Aggregate ingredients by name+app+category
  const agg = {};
  allDishes.forEach(d => {
    (d.ingredients || []).forEach(ing => {
      const cat = classifyIngredient(ing.name);
      const k = `${ing.name}|${ing.app}|${cat}`;
      if (!agg[k]) agg[k] = { name:ing.name, app:ing.app, cat, qtys:[] };
      agg[k].qtys.push(ing.qty);
    });
  });

  // Group by app, then by category
  const groups = {}; // { dingdong: { ingredient:[], auxiliary:[], seasoning:[] }, meituan: {...} }
  Object.values(agg).forEach(item => {
    const uniqueQtys = [...new Set(item.qtys)];
    const qtyStr = uniqueQtys.length === 1 ? uniqueQtys[0] : uniqueQtys.join('/');
    const entry = { name:item.name, qty:qtyStr };
    if (!groups[item.app]) groups[item.app] = { ingredient:[], auxiliary:[], seasoning:[] };
    groups[item.app][item.cat].push(entry);
  });

  let html = '<h2>🛒 今日食材采购清单</h2>';

  function renderAppSection(appKey, appLabel, appClass) {
    const g = groups[appKey];
    if (!g) return '';
    const cats = ['ingredient','auxiliary','seasoning'];
    const items = cats.flatMap(c => g[c]);
    if (items.length === 0) return '';

    let section = `<div class="app-section">
      <span class="app-title ${appClass}">${appLabel}</span>`;

    cats.forEach(cat => {
      if (g[cat].length === 0) return;
      section += `<div class="cat-group">
        <div class="cat-label">${CAT_LABELS[cat]}</div>
        <ul>${g[cat].map(i => `<li><span>${i.name}</span><span class="qty">${i.qty}</span></li>`).join('')}</ul>
      </div>`;
    });

    section += '</div>';
    return section;
  }

  html += renderAppSection('dingdong', '🥬 叮咚买菜', 'dingdong');
  html += renderAppSection('meituan', '🛵 美团外卖', 'meituan');

  html += '<div class="note">💡 建议优先叮咚买菜购买生鲜食材；调味品饮料可在美团外卖补货。📍 配送至：杭州市拱墅区沁润公寓</div>';
  container.innerHTML = html;
}

  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      if (confirm('确定要重置所有口味偏好吗？')) {
        state.liked = {};
        state.disliked = {};
        state.history = {};
        state.menu = {};
        bumpVersion();
        saveState(state);
        selectedDate = new Date(today);
        currentMonday = getMonday(today);
        renderAll();
      }
    });
  }
}

function findDishName(id) {
  for (const cat of ['meat','halfMeat','vegetable','soup']) {
    const d = allDishes()[cat].find(x => x.id === id);
    if (d) return d.name;
  }
  return null;
}

function findDishCat(id) {
  for (const cat of ['meat','halfMeat','vegetable','soup']) {
    if (allDishes()[cat].find(x => x.id === id)) return cat;
  }
  return null;
}

function renderAll() {
  renderWeekNav();
  renderDayDetail();
  renderShoppingList();
  renderPrefs();
}

// Week navigation
document.getElementById('btnPrevWeek').addEventListener('click', () => {
  currentMonday.setDate(currentMonday.getDate() - 7);
  selectedDate = new Date(currentMonday);
  renderAll();
});

document.getElementById('btnNextWeek').addEventListener('click', () => {
  currentMonday.setDate(currentMonday.getDate() + 7);
  selectedDate = new Date(currentMonday);
  renderAll();
});

// ============ ADD DISH MODAL ============
let nextCustomId = (() => {
  let max = 0;
  for (const cat of ['meat','halfMeat','vegetable','soup']) {
    (state.customDishes[cat] || []).forEach(d => {
      const m = d.id.match(/^c(\d+)$/);
      if (m) max = Math.max(max, parseInt(m[1]));
    });
  }
  return max + 1;
})();

function openAddDishModal() {
  document.getElementById('modalTitle').textContent = '＋ 添加新菜';
  document.getElementById('dishName').value = '';
  document.getElementById('dishCat').value = 'meat';
  document.getElementById('dishSteps').value = '';
  document.getElementById('dishVideo').value = '';
  document.getElementById('ingredientRows').innerHTML = `
    <div class="ingredient-row">
      <input type="text" placeholder="食材名" class="ing-name">
      <input type="text" placeholder="用量" class="ing-qty" style="width:100px">
      <select class="ing-app"><option value="dingdong">叮咚</option><option value="meituan">美团</option></select>
      <button class="btn-remove-ing" onclick="this.parentElement.remove()">✕</button>
    </div>`;
  document.getElementById('modalOverlay').classList.add('show');
}

function closeAddDishModal() {
  document.getElementById('modalOverlay').classList.remove('show');
}

function saveNewDish() {
  const name = document.getElementById('dishName').value.trim();
  if (!name) { alert('请输入菜品名称'); return; }

  const cat = document.getElementById('dishCat').value;
  const steps = document.getElementById('dishSteps').value.trim();
  const video = document.getElementById('dishVideo').value.trim();

  const ingredients = [];
  document.querySelectorAll('#ingredientRows .ingredient-row').forEach(row => {
    const ingName = row.querySelector('.ing-name').value.trim();
    const qty = row.querySelector('.ing-qty').value.trim();
    const app = row.querySelector('.ing-app').value;
    if (ingName) {
      ingredients.push({ name: ingName, qty: qty || '适量', app });
    }
  });

  if (ingredients.length === 0) { alert('请至少添加一个食材'); return; }

  const newDish = {
    id: 'c' + (nextCustomId++),
    name,
    steps: steps || '（未填写步骤）',
    video: video || `https://search.bilibili.com/all?keyword=${encodeURIComponent(name)}`,
    ingredients
  };

  if (!state.customDishes[cat]) state.customDishes[cat] = [];
  state.customDishes[cat].push(newDish);

  // Regenerate current week menu to include the new dish going forward
  const weekKey = dateKey(getMonday(today));
  delete state.menu[weekKey];
  selectedDate = new Date(today);
  currentMonday = getMonday(today);

  bumpVersion();
  saveState(state);
  closeAddDishModal();
  renderAll();
}

// Modal event listeners
document.getElementById('btnCancelDish').addEventListener('click', closeAddDishModal);
document.getElementById('modalOverlay').addEventListener('click', function(e) {
  if (e.target === this) closeAddDishModal();
});
document.getElementById('btnSaveDish').addEventListener('click', saveNewDish);
document.getElementById('btnAddIng').addEventListener('click', function() {
  const rows = document.getElementById('ingredientRows');
  const row = document.createElement('div');
  row.className = 'ingredient-row';
  row.innerHTML = `
    <input type="text" placeholder="食材名" class="ing-name">
    <input type="text" placeholder="用量" class="ing-qty" style="width:100px">
    <select class="ing-app"><option value="dingdong">叮咚</option><option value="meituan">美团</option></select>
    <button class="btn-remove-ing" onclick="this.parentElement.remove()">✕</button>`;
  rows.appendChild(row);
});

// ============ NOTIFICATIONS (auntie mode) ============
if (MODE === 'auntie') {
  let lastSeenVersion = sessionStorage.getItem('dinner_last_seen') ? parseInt(sessionStorage.getItem('dinner_last_seen')) : state.version;

  function checkForUpdates() {
    const current = loadState().version;
    if (current > lastSeenVersion) {
      lastSeenVersion = current;
      sessionStorage.setItem('dinner_last_seen', current);
      showUpdateNotification(current);
    }
  }

  function showUpdateNotification(ver) {
    if (Notification.permission === 'granted') {
      new Notification('🍽️ 菜单已更新', {
        body: '业主刚刚修改了菜单，刷新页面查看最新菜谱',
        icon: 'icons/icon-192.png',
        tag: 'dinner-update'
      });
    }
  }

  // Request notification permission on first load
  if ('Notification' in window && Notification.permission === 'default') {
    setTimeout(() => {
      Notification.requestPermission();
    }, 3000);
  }

  // Check on load
  setTimeout(() => checkForUpdates(), 500);

  // Check periodically every 30 seconds
  setInterval(checkForUpdates, 30000);

  // Also check when page becomes visible (user switches back to this PWA)
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) checkForUpdates();
  });

  // Also show a badge in the header if there are updates
  let badgeInterval = setInterval(() => {
    const current = loadState().version;
    const badge = document.getElementById('updateBadge');
    if (current > lastSeenVersion) {
      if (!badge) {
        const h1 = document.querySelector('.header h1');
        if (h1) {
          const span = document.createElement('span');
          span.id = 'updateBadge';
          span.style.cssText = 'display:inline-block;background:#ffcc02;color:#3e2723;font-size:10px;padding:2px 8px;border-radius:10px;margin-left:8px;animation:pulse 1.5s infinite';
          span.textContent = '有新菜单';
          h1.appendChild(span);
          const style = document.createElement('style');
          style.textContent = '@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}';
          document.head.appendChild(style);
        }
      }
    } else {
      if (badge) badge.remove();
    }
  }, 5000);
}

// ============ INIT ============
renderAll();

// Register service worker for offline support
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
